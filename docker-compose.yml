services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: foxtrust
      POSTGRES_PASSWORD: foxtrust
      POSTGRES_DB: foxtrust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxtrust -d foxtrust"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
