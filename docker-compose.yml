services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: foxtrust
      POSTGRES_PASSWORD: foxtrust
      POSTGRES_DB: foxtrust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxtrust -d foxtrust"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Feed ingestion on a schedule, nightly retention, and snapshot builds (daily full, hourly delta).
  # Docker restarts it if it exits; `docker compose ps` shows "unhealthy" when its heartbeat is
  # older than 3 minutes. Snapshot jobs run only when the signing key secret is present.
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foxtrust:foxtrust@db:5432/foxtrust
      FOXTRUST_SIGNING_KEY: /run/secrets/signing_key
      FOXTRUST_DISPUTE_URL: ${FOXTRUST_DISPUTE_URL:-}
      # Operator alerts in Telegram (spec 004); empty values turn them off.
      FOXTRUST_TELEGRAM_BOT_TOKEN: ${FOXTRUST_TELEGRAM_BOT_TOKEN:-}
      FOXTRUST_TELEGRAM_CHAT_ID: ${FOXTRUST_TELEGRAM_CHAT_ID:-}
    secrets:
      - signing_key
    volumes:
      - feed-artifacts:/app/var
      - publication:/app/var/publication
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Public, read-only file server for snapshots (contracts/publication.md). Put a TLS proxy in front.
  publication:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/cli/main.ts", "publication", "serve"]  # var/publication, port 8081
    volumes:
      - publication:/app/var/publication:ro
    ports:
      - "8081:8081"
    # Healthy when it answers at all (a 404 before the first snapshot is fine).
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8081/v1/manifest.json').then(() => process.exit(0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Customer-side forward-auth service (contracts/verify-http.md). No database.
  verify:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/cli/main.ts", "verify", "serve"]
    environment:
      FOXTRUST_PUBLICATION_URL: http://publication:8081
      FOXTRUST_TRUSTED_KEYS: ${FOXTRUST_TRUSTED_KEYS:-}
      FOXTRUST_POLICY_FILE: /app/config/policies/example.yaml
      FOXTRUST_TRUSTED_PROXIES: 172.16.0.0/12
      # A path such as /.foxtrust/challenge turns on the built-in challenge page (needs the secret).
      FOXTRUST_CHALLENGE_URL: ${FOXTRUST_CHALLENGE_URL:-}
      FOXTRUST_CHALLENGE_SECRET: ${FOXTRUST_CHALLENGE_SECRET:-}
      FOXTRUST_CHALLENGE_DIFFICULTY: ${FOXTRUST_CHALLENGE_DIFFICULTY:-}
      FOXTRUST_CHALLENGE_TTL_SECONDS: ${FOXTRUST_CHALLENGE_TTL_SECONDS:-}
      FOXTRUST_PASS_TTL_MINUTES: ${FOXTRUST_PASS_TTL_MINUTES:-}
      FOXTRUST_CHALLENGE_NOJS: ${FOXTRUST_CHALLENGE_NOJS:-}
      FOXTRUST_CHALLENGE_NOJS_WAIT_SECONDS: ${FOXTRUST_CHALLENGE_NOJS_WAIT_SECONDS:-}
      # Bot verdict of the built-in page: observe (default), enforce or off.
      FOXTRUST_BOT_MODE: ${FOXTRUST_BOT_MODE:-}
      FOXTRUST_BOT_STEPUP: ${FOXTRUST_BOT_STEPUP:-}
      FOXTRUST_BOT_BLOCK: ${FOXTRUST_BOT_BLOCK:-}
      FOXTRUST_BOT_AFTER_STEPUP: ${FOXTRUST_BOT_AFTER_STEPUP:-}
      FOXTRUST_BOT_STEPUP_BITS: ${FOXTRUST_BOT_STEPUP_BITS:-}
      # Press-and-hold step: on by default.
      FOXTRUST_BOT_HOLD: ${FOXTRUST_BOT_HOLD:-}
      # Returning-device token of the built-in page: on by default; revocations live in the volume below.
      FOXTRUST_DEVICE: ${FOXTRUST_DEVICE:-}
      FOXTRUST_DEVICE_TTL_DAYS: ${FOXTRUST_DEVICE_TTL_DAYS:-}
      FOXTRUST_DEVICE_CAP: ${FOXTRUST_DEVICE_CAP:-}
    volumes:
      - verify-state:/app/var/verify
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Public API v1 (specs/010-public-api): verdicts from the published snapshot; accounts, keys and
  # usage counts in the database. Publish it through the tunnel (e.g. api.foxtrust.dev).
  api:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/cli/main.ts", "api", "serve"]
    depends_on:
      db:
        condition: service_healthy
      publication:
        condition: service_started
    environment:
      DATABASE_URL: postgres://foxtrust:foxtrust@db:5432/foxtrust
      FOXTRUST_PUBLICATION_URL: http://publication:8081
      FOXTRUST_TRUSTED_KEYS: ${FOXTRUST_TRUSTED_KEYS:-}
      FOXTRUST_API_FREE_DAILY: ${FOXTRUST_API_FREE_DAILY:-}
      FOXTRUST_API_FREE_BURST: ${FOXTRUST_API_FREE_BURST:-}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Public site (specs/012-public-site): landing, the permanent /dispute page and the docs. Without
  # FOXTRUST_SITE_CLIENT_ID it serves the public pages only and needs neither the database nor
  # foxauth. No `ports:`: publish it through the proxy as the root of the domain (foxtrust.dev).
  site:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/cli/main.ts", "site", "serve"]
    environment:
      FOXTRUST_SITE_URL: ${FOXTRUST_SITE_URL:-http://127.0.0.1:8084}
      FOXTRUST_SITE_API_URL: ${FOXTRUST_SITE_API_URL:-}
      FOXTRUST_SITE_PUBLICATION_URL: ${FOXTRUST_SITE_PUBLICATION_URL:-}
      FOXTRUST_TRUSTED_KEYS: ${FOXTRUST_TRUSTED_KEYS:-}
      FOXTRUST_API_FREE_DAILY: ${FOXTRUST_API_FREE_DAILY:-}
      FOXTRUST_API_FREE_BURST: ${FOXTRUST_API_FREE_BURST:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8084/dispute || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Operator admin panel (specs/011-admin-panel). No `ports:` on purpose: it must not listen on a
  # host port. The tunnel connector reaches it on this compose network (admin:8083), behind
  # Cloudflare Access; the panel also requires a foxauth sign-in by the operator group.
  admin:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/cli/main.ts", "admin", "serve"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foxtrust:foxtrust@db:5432/foxtrust
      FOXTRUST_ADMIN_URL: ${FOXTRUST_ADMIN_URL:-}
      FOXTRUST_ADMIN_ISSUER: ${FOXTRUST_ADMIN_ISSUER:-https://auth.foxauth.dev}
      FOXTRUST_ADMIN_CLIENT_ID: ${FOXTRUST_ADMIN_CLIENT_ID:-}
      FOXTRUST_ADMIN_CLIENT_SECRET_FILE: /run/secrets/admin_client_secret
      FOXTRUST_ADMIN_GROUP: ${FOXTRUST_ADMIN_GROUP:-}
      FOXTRUST_API_FREE_DAILY: ${FOXTRUST_API_FREE_DAILY:-}
      FOXTRUST_API_FREE_BURST: ${FOXTRUST_API_FREE_BURST:-}
    secrets:
      - admin_client_secret
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/static/admin.css || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

secrets:
  signing_key:
    file: ${FOXTRUST_SIGNING_KEY_FILE:-./var/keys/signing.key.pem}
  admin_client_secret:
    file: ${FOXTRUST_ADMIN_CLIENT_SECRET_HOST_FILE:-./var/keys/admin-client-secret}

volumes:
  pgdata:
  feed-artifacts:
  publication:
  verify-state:
