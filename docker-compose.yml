services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: foxtrust
      POSTGRES_PASSWORD: foxtrust
      POSTGRES_DB: foxtrust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxtrust -d foxtrust"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Feed ingestion on a schedule plus nightly retention. Docker restarts it if it exits;
  # `docker compose ps` shows "unhealthy" when its heartbeat is older than 3 minutes.
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foxtrust:foxtrust@db:5432/foxtrust
    volumes:
      - feed-artifacts:/app/var
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  feed-artifacts:
